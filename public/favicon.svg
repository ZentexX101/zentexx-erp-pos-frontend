<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>ZenoPOS</title>
  <defs>
    <linearGradient id="zp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Rounded tile -->
  <rect width="64" height="64" rx="15" fill="url(#zp-bg)"/>
  <!-- The "Z" (drawn as a shape, so it looks the same without any font) -->
  <path d="M16 14h32v8L28.5 42H48v8H16v-8l19.5-20H16z" fill="#fff"/>
  <!-- Barcode scan line across the middle: the point-of-sale touch -->
  <rect x="9" y="30.5" width="46" height="3" rx="1.5" fill="#34d399"/>
</svg>
