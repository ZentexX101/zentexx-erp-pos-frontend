<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Decent Electronics & Exchange Center</title>
    <!-- Splash: shown before the app's JS loads, and reused by FullPageLoader, so a reload shows one loader -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #f1f5f9 70%);
        font-family: ui-sans-serif, system-ui, sans-serif;
        z-index: 100;
      }
      .splash-logo {
        height: 44px;
        width: auto;
        animation: splash-breathe 2.4s ease-in-out infinite;
      }
      .splash-track {
        position: relative;
        width: 168px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: #e2e8f0;
      }
      .splash-bar {
        position: absolute;
        inset-block: 0;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #94a3b8, #0f172a);
        animation: splash-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      .splash-text {
        margin: 0;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #64748b;
      }
      @keyframes splash-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      @keyframes splash-breathe {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(0.98); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo { animation: none; }
        .splash-bar { animation-duration: 2.5s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <img class="splash-logo" src="/src/assets/decent-logo-dark.png" alt="Decent" />
        <div class="splash-track"><div class="splash-bar"></div></div>
        <p class="splash-text">Loading your workspace</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
